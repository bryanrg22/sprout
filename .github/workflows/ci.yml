# Pull-request and main-branch CI.
#
# One workflow, and every job always runs, so each check can be marked required in
# branch protection (a workflow skipped by a path filter leaves a required check
# pending forever).
#
# The repository is public: this workflow uses no secret, no API key and no signing
# identity. Tests that need a model provider run against scripted responses; the
# paid evaluations (Evals/run.sh) are never run here.
#
# Every third-party action is pinned to a full commit SHA (tag in the comment);
# Dependabot (.github/dependabot.yml) proposes updates.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    # Pinned OS label: `macos-latest` moves between major versions over weeks.
    runs-on: macos-26
    timeout-minutes: 40
    env:
      # The image's default Xcode is newer; build with the version the app is developed on.
      DEVELOPER_DIR: /Applications/Xcode_26.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Toolchain
        run: |
          xcodebuild -version
          brew install xcodegen
          xcodegen --version

      # Sources are globbed by xcodegen, so regenerating here catches a file that
      # exists on a laptop but was never added.
      - name: Generate the project
        run: xcodegen generate

      # A named local simulator does not exist on a runner: create one on the newest
      # iOS runtime this Xcode has, and address it by id.
      - name: Create a simulator
        id: sim
        run: |
          RUNTIME=$(xcrun simctl list runtimes -j | python3 -c "
          import json, sys
          rts = [r for r in json.load(sys.stdin)['runtimes'] if r.get('isAvailable') and r.get('platform') == 'iOS']
          rts.sort(key=lambda r: [int(x) for x in r['version'].split('.')])
          print(rts[-1]['identifier'])")
          UDID=$(xcrun simctl create Sprout-CI "iPhone 17 Pro" "$RUNTIME")
          echo "runtime=$RUNTIME" >> "$GITHUB_OUTPUT"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "Simulator $UDID on $RUNTIME"

      - name: Unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project Sprout.xcodeproj -scheme Sprout \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath "$RUNNER_TEMP/unit.xcresult" \
            -enableCodeCoverage YES \
            -parallel-testing-enabled NO \
            | xcbeautify --quiet

      # Never trust the pipe: read the counts out of the result bundle. The minimum
      # is what stops "no tests were found" from reading as green; raise it in the
      # change that adds tests (SproutTests/LEDGER.md has the current total).
      - name: Verify unit test counts
        if: ${{ !cancelled() }}
        run: |
          python3 tooling/check_xcresult.py "$RUNNER_TEMP/unit.xcresult" --min-tests 1234 --markdown >> "$GITHUB_STEP_SUMMARY"
          python3 tooling/check_xcresult.py "$RUNNER_TEMP/unit.xcresult" --min-tests 1234

      - name: Coverage by target
        if: ${{ !cancelled() }}
        run: |
          {
            echo ''
            echo '```'
            xcrun xccov view --report --only-targets "$RUNNER_TEMP/unit.xcresult"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The evaluation harness's own checks: graders against hand-written outputs and
      # every dataset row against the app. The twelve live evaluations and the avatar
      # regrade skip here (no key and no saved run, by design): exactly 13 skips are allowed.
      - name: Evaluation harness self-tests (offline)
        run: |
          set -o pipefail
          xcodebuild test \
            -project Sprout.xcodeproj -scheme SproutEvals \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath "$RUNNER_TEMP/evals.xcresult" \
            -parallel-testing-enabled NO \
            | xcbeautify --quiet

      - name: Verify evaluation self-test counts
        if: ${{ !cancelled() }}
        run: python3 tooling/check_xcresult.py "$RUNNER_TEMP/evals.xcresult" --min-tests 114 --max-skipped 20

      - name: Upload result bundles
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: xcresult
          path: |
            ${{ runner.temp }}/unit.xcresult
            ${{ runner.temp }}/evals.xcresult
          if-no-files-found: warn
          retention-days: 14

  # End-to-end flows through the real UI, against a scripted model and an in-memory store
  # (SproutUITests/README.md). Separate from `test` so a slow or flaky simulator boot
  # here cannot hide a unit-test result.
  ui-tests:
    runs-on: macos-26
    # The UI flows took about 37 of 40 minutes, and the job ran out of time once the VoiceOver
    # flows were added (EVAL_REPORT 43).
    timeout-minutes: 50
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: brew install xcodegen && xcodegen generate
      - name: Create a simulator
        id: sim
        run: |
          RUNTIME=$(xcrun simctl list runtimes -j | python3 -c "
          import json, sys
          rts = [r for r in json.load(sys.stdin)['runtimes'] if r.get('isAvailable') and r.get('platform') == 'iOS']
          rts.sort(key=lambda r: [int(x) for x in r['version'].split('.')])
          print(rts[-1]['identifier'])")
          UDID=$(xcrun simctl create Sprout-CI-UI "iPhone 17 Pro" "$RUNTIME")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
      - name: UI smoke flows
        run: |
          set -o pipefail
          xcodebuild test \
            -project Sprout.xcodeproj -scheme SproutUITests \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath "$RUNNER_TEMP/ui.xcresult" \
            -parallel-testing-enabled NO \
            | xcbeautify --quiet
      - name: Verify UI flow counts
        if: ${{ !cancelled() }}
        run: |
          python3 tooling/check_xcresult.py "$RUNNER_TEMP/ui.xcresult" --min-tests 33 --markdown >> "$GITHUB_STEP_SUMMARY"
          python3 tooling/check_xcresult.py "$RUNNER_TEMP/ui.xcresult" --min-tests 33
      - name: Upload the result bundle
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-xcresult
          path: ${{ runner.temp }}/ui.xcresult
          if-no-files-found: warn
          retention-days: 14

  # The archive configuration is what ships to TestFlight; a Release build that
  # stops compiling should be found here, not on upload day.
  release-build:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: brew install xcodegen && xcodegen generate
      - name: Build Release for the simulator (no signing)
        run: |
          set -o pipefail
          xcodebuild build \
            -project Sprout.xcodeproj -scheme Sprout -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --quiet

  # A bring-your-own-key app's realistic leak is a developer's own test key in a
  # fixture, a plist or a recorded response. Runs on every change, full history.
  secrets-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read # gitleaks-action lists the PR's commits through the API
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # No GITLEAKS_LICENSE: required for organization repositories only. Comments and
      # the SARIF artifact are off so no finding detail is published from a public repo.
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  # Python tooling and the eval scripts must at least parse, the store verifier must
  # catch every violation it claims to, and the eval datasets must be the ones their
  # build scripts produce.
  tooling:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scripts compile
        run: python3 -m py_compile tooling/*.py Evals/*.py Evals/datasets/*/*.py learn/sql/*.py
      # The checker must find a schema that lacks what the manifest lists, and pass one that has it.
      - name: CloudKit schema checker agrees with the committed schemas
        run: |
          python3 tooling/check_cloudkit_schema.py docs/cloudkit/schema-development-2026-11-23.ckdb docs/cloudkit/model-manifest.json
          if python3 tooling/check_cloudkit_schema.py docs/cloudkit/schema-production-2026-11-23.ckdb docs/cloudkit/model-manifest.json > /dev/null; then
            echo "the checker passed a schema known to be missing 18 record types"; exit 1
          fi
      - name: Shell scripts parse
        run: bash -n Evals/run.sh && bash -n Evals/regrade-avatars.sh && bash -n Evals/regrade-text.sh && bash -n tooling/evidence/capture.sh
      # Builds temporary SQLite stores with one violation of each rule and checks the
      # report flags it (and that a clean store passes). Standard library only.
      - name: Store verifier self-test
        run: python3 tooling/verify_store.py --self-test
      # The SQL course (learn/sql): the checker passes the reference answers and catches wrong
      # ones, and the answers committed in exercises/ are right (one not attempted yet is fine).
      - name: SQL course checker
        run: |
          python3 learn/sql/check.py --self-test
          python3 learn/sql/check.py --answers learn/sql/solutions --all
          python3 learn/sql/check.py
      - name: meal_describe/v1.jsonl is what its build script produces
        run: |
          cp Evals/datasets/meal_describe/v1.jsonl /tmp/v1.before
          python3 Evals/datasets/meal_describe/build_v1.py > /dev/null
          diff /tmp/v1.before Evals/datasets/meal_describe/v1.jsonl
      - name: meal_describe/v3.jsonl is what its build script produces
        run: |
          cp Evals/datasets/meal_describe/v3.jsonl /tmp/v3.before
          python3 Evals/datasets/meal_describe/build_v3.py > /dev/null
          diff /tmp/v3.before Evals/datasets/meal_describe/v3.jsonl
      - name: meal_describe/v4.jsonl and meal_photo/v1.jsonl are what their build scripts produce
        run: |
          cp Evals/datasets/meal_describe/v4.jsonl /tmp/v4.before
          python3 Evals/datasets/meal_describe/build_v4.py > /dev/null
          diff /tmp/v4.before Evals/datasets/meal_describe/v4.jsonl
          test "$(wc -l < Evals/datasets/meal_photo/v1.jsonl)" -eq 30
          python3 -c "import json,os; rows=[json.loads(l) for l in open('Evals/datasets/meal_photo/v1.jsonl')]; missing=[r['photo'] for r in rows if not os.path.exists('Evals/datasets/meal_photo/'+r['photo'])]; assert not missing, missing"
      - name: Judge scripts parse
        run: python3 -m py_compile Evals/judge.py Evals/judge_agreement.py

  # The built-in AI gateway (server/): its App Attest checks, store and routes, in the
  # Node version the droplet runs.
  gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tests in the image the droplet runs (node:24-slim)
        run: docker build --target build -t sprout-gateway-ci .
