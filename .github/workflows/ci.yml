# Pull-request and main-branch CI.
#
# One workflow, and every job always runs, so each check can be marked required in
# branch protection (a workflow skipped by a path filter leaves a required check
# pending forever).
#
# The repository is public: this workflow uses no secret, no API key and no signing
# identity. Tests that need a model provider run against scripted responses; the
# paid evaluations (Evals/run.sh) are never run here.
#
# Every third-party action is pinned to a full commit SHA (tag in the comment);
# Dependabot (.github/dependabot.yml) proposes updates.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    # Pinned OS label: `macos-latest` moves between major versions over weeks.
    runs-on: macos-26
    timeout-minutes: 40
    env:
      # The image's default Xcode is newer; build with the version the app is developed on.
      DEVELOPER_DIR: /Applications/Xcode_26.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Toolchain
        run: |
          xcodebuild -version
          brew install xcodegen
          xcodegen --version

      # Sources are globbed by xcodegen, so regenerating here catches a file that
      # exists on a laptop but was never added.
      - name: Generate the project
        run: xcodegen generate

      # A named local simulator does not exist on a runner: create one on the newest
      # iOS runtime this Xcode has, and address it by id.
      - name: Create a simulator
        id: sim
        run: |
          RUNTIME=$(xcrun simctl list runtimes -j | python3 -c "
          import json, sys
          rts = [r for r in json.load(sys.stdin)['runtimes'] if r.get('isAvailable') and r.get('platform') == 'iOS']
          rts.sort(key=lambda r: [int(x) for x in r['version'].split('.')])
          print(rts[-1]['identifier'])")
          UDID=$(xcrun simctl create Sprout-CI "iPhone 17 Pro" "$RUNTIME")
          echo "runtime=$RUNTIME" >> "$GITHUB_OUTPUT"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "Simulator $UDID on $RUNTIME"

      - name: Unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project Victoria.xcodeproj -scheme Victoria \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath "$RUNNER_TEMP/unit.xcresult" \
            -enableCodeCoverage YES \
            -parallel-testing-enabled NO \
            | xcbeautify --quiet

      # Never trust the pipe: read the counts out of the result bundle. The minimum
      # is what stops "no tests were found" from reading as green; raise it in the
      # change that adds tests (VictoriaTests/LEDGER.md has the current total).
      - name: Verify unit test counts
        if: ${{ !cancelled() }}
        run: |
          python3 tooling/check_xcresult.py "$RUNNER_TEMP/unit.xcresult" --min-tests 508 --markdown >> "$GITHUB_STEP_SUMMARY"
          python3 tooling/check_xcresult.py "$RUNNER_TEMP/unit.xcresult" --min-tests 508

      - name: Coverage by target
        if: ${{ !cancelled() }}
        run: |
          {
            echo ''
            echo '```'
            xcrun xccov view --report --only-targets "$RUNNER_TEMP/unit.xcresult"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The evaluation harness's own checks: graders against hand-written outputs and
      # every dataset row against the app. The three live evaluations skip here
      # (no key, by design), which is why exactly 3 skips are allowed.
      - name: Evaluation harness self-tests (offline)
        run: |
          set -o pipefail
          xcodebuild test \
            -project Victoria.xcodeproj -scheme VictoriaEvals \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath "$RUNNER_TEMP/evals.xcresult" \
            -parallel-testing-enabled NO \
            | xcbeautify --quiet

      - name: Verify evaluation self-test counts
        if: ${{ !cancelled() }}
        run: python3 tooling/check_xcresult.py "$RUNNER_TEMP/evals.xcresult" --min-tests 21 --max-skipped 3

      - name: Upload result bundles
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: xcresult
          path: |
            ${{ runner.temp }}/unit.xcresult
            ${{ runner.temp }}/evals.xcresult
          if-no-files-found: warn
          retention-days: 14

  # The archive configuration is what ships to TestFlight; a Release build that
  # stops compiling should be found here, not on upload day.
  release-build:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: brew install xcodegen && xcodegen generate
      - name: Build Release for the simulator (no signing)
        run: |
          set -o pipefail
          xcodebuild build \
            -project Victoria.xcodeproj -scheme Victoria -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --quiet

  # A bring-your-own-key app's realistic leak is a developer's own test key in a
  # fixture, a plist or a recorded response. Runs on every change, full history.
  secrets-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read # gitleaks-action lists the PR's commits through the API
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # No GITLEAKS_LICENSE: required for organization repositories only. Comments and
      # the SARIF artifact are off so no finding detail is published from a public repo.
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  # Python tooling and the eval scripts must at least parse, and the eval datasets
  # must be the ones their build scripts produce.
  tooling:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scripts compile
        run: python3 -m py_compile tooling/*.py Evals/*.py Evals/datasets/*/*.py
      - name: Shell scripts parse
        run: bash -n Evals/run.sh && bash -n tooling/evidence/capture.sh
      - name: meal_describe/v1.jsonl is what its build script produces
        run: |
          cp Evals/datasets/meal_describe/v1.jsonl /tmp/v1.before
          python3 Evals/datasets/meal_describe/build_v1.py > /dev/null
          diff /tmp/v1.before Evals/datasets/meal_describe/v1.jsonl
