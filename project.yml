name: Sprout
options:
  bundleIdPrefix: com.bryanram
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    MARKETING_VERSION: "2.1"
    CURRENT_PROJECT_VERSION: "16"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: "C924TNC23B"
    CODE_SIGN_STYLE: Automatic
    SWIFT_EMIT_LOC_STRINGS: YES

targets:
  Sprout:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    # Strip extended attributes (esp. com.apple.FinderInfo, which macOS keeps re-adding to the
    # built .app bundle during packaging) right before Xcode's CodeSign step — otherwise codesign
    # aborts with "resource fork, Finder information, or similar detritus not allowed". Runs every
    # build (no dependency analysis) so it can't be skipped incrementally.
    postBuildScripts:
      # Personal content is not in the repository: the onboarding note (`PersonalNote`) and
      # the cute character's own lines (`CompanionPhrases`). When the building machine has
      # `Private/<name>.json` it is copied into the app; when it does not, any copy left by an
      # earlier build is removed, so a build never ships content its machine does not have.
      - name: "Private content (optional, not in the repository)"
        basedOnDependencyAnalysis: false
        script: |
          for name in PersonalNote CompanionPhrases; do
            src="${SRCROOT}/Private/${name}.json"
            dst="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/${name}.json"
            if [ -f "$src" ]; then cp "$src" "$dst"; else rm -f "$dst"; fi
          done
      - name: "Strip xattrs (codesign hygiene)"
        basedOnDependencyAnalysis: false
        script: '/usr/bin/xattr -cr "${TARGET_BUILD_DIR}/${WRAPPER_NAME}" 2>/dev/null || true'
    scheme:
      testTargets:
        - SproutTests
    sources:
      - path: Sprout
      - path: Shared
    dependencies:
      - target: SproutWidgets
        embed: true
    entitlements:
      path: Sprout/Sprout.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.bryanram.victoria
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.bryanram.victoria
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.developer.healthkit: true
        aps-environment: production
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bryanram.victoria
        PRODUCT_NAME: Sprout
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIconPanda AppIconVictoria AppIconBryan"
        CURRENT_PROJECT_VERSION: "16"
        MARKETING_VERSION: "2.1"
        INFOPLIST_KEY_CFBundleDisplayName: Sprout
        # Lets CloudKit's SILENT snapshot-changed push (ensureSnapshotSubscription) wake the app in
        # the background to refresh the buddy hub. Foreground refresh works without it; this enables
        # the background case.
        INFOPLIST_KEY_UIBackgroundModes: remote-notification
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_NSCameraUsageDescription: "Sprout uses the camera so you can snap a photo of your meal for a calorie and macro estimate, or a photo of yourself to make your pixel character."
        INFOPLIST_KEY_NSHealthShareUsageDescription: "Sprout reads your weight and step count from Apple Health so your trend and daily activity stay in sync."
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: "Sprout saves the weigh-ins you log to Apple Health so your data lives in one place."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Sprout lets you pick a meal photo from your library to estimate its calories and macros, or a photo of yourself to make your pixel character."
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Sprout uses your location to suggest healthy food options near you when you're out."

  SproutWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    # Same codesign hygiene as the app target — strip xattrs from the .appex before its CodeSign.
    postBuildScripts:
      - name: "Strip xattrs (codesign hygiene)"
        basedOnDependencyAnalysis: false
        script: '/usr/bin/xattr -cr "${TARGET_BUILD_DIR}/${WRAPPER_NAME}" 2>/dev/null || true'
    sources:
      - path: SproutWidgets
      - path: Shared
    entitlements:
      path: SproutWidgets/SproutWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.bryanram.victoria
    info:
      path: SproutWidgets/Info.plist
      properties:
        CFBundleDisplayName: Sprout
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bryanram.victoria.widgets
        PRODUCT_NAME: SproutWidgets
        TARGETED_DEVICE_FAMILY: "1"
        CURRENT_PROJECT_VERSION: "16"
        MARKETING_VERSION: "2.1"

  # Model evaluations (Evals/): the app's real AI code paths run against labelled
  # datasets across candidate models. Its own scheme, so `-scheme Sprout` never
  # runs it; live cases skip unless Evals/run.sh configured them.
  SproutEvals:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: SproutEvals
      - path: SproutTests/Support
    dependencies:
      - target: Sprout
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bryanram.victoria.evals
        GENERATE_INFOPLIST_FILE: YES

  SproutTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: SproutTests
    dependencies:
      - target: Sprout
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bryanram.victoria.tests
        GENERATE_INFOPLIST_FILE: YES

  # UI smoke flows (XCUITest): the main paths end to end against an in-memory store and a
  # scripted model (`--ui-testing`, see SproutUITests/README.md). Its own scheme, so
  # `-scheme Sprout` never runs it. `AccessibilityID.swift` is compiled into both the app
  # and this bundle so the identifiers cannot drift apart.
  SproutUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: SproutUITests
      - path: Sprout/App/AccessibilityID.swift
    dependencies:
      - target: Sprout
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bryanram.victoria.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Sprout

schemes:
  SproutUITests:
    build:
      targets:
        Sprout: all
        SproutUITests: [test]
    test:
      targets:
        - SproutUITests
  SproutEvals:
    build:
      targets:
        Sprout: all
        SproutEvals: [test]
    test:
      targets:
        - SproutEvals
